# ==============================================================================
# NOCTALIA SHELL V5 - CUSTOM TOP BAR CONFIGURATION
# ==============================================================================

[theme]
mode              = "dark"
source            = "custom"
custom_palette    = "CatppuccinCustom"
pure_black_dark   = false

[shell]
corner_radius_scale   = 0.8
button_borders        = false
input_borders         = true
popup_borders         = true
card_borders          = true
popup_shadows         = true
font_family           = "Noto Sans"
time_format           = "{:%H:%M}"
date_format           = "%A, %d %B"
polkit_agent          = true
clipboard_enabled     = true
clipboard_history_max_entries = 100
setup_wizard_enabled  = false
settings_show_advanced = true
settings_window_translucent = true

[shell.animation]
enabled = true
speed   = 1.1

[shell.shadow]
direction = "down"
alpha     = 0.35

[shell.panel]
transparency_mode     = "soft"
borders               = true
shadow                = true
list_item_background  = true
floating_layer        = "overlay"
launcher_placement    = "floating"
clipboard_placement   = "floating"
control_center_placement = "attached"
wallpaper_placement   = "attached"
session_placement     = "attached"
polkit_placement      = "floating"
launcher_position     = "center"
clipboard_position    = "center"
polkit_position       = "center"
floating_offset       = 4

[system.monitor]
enabled = true
network_poll_seconds = 1.0

# ==============================================================================
# WIDGET DEFINITIONS
# ==============================================================================

[widget.fedora-logo]
type = "custom_button"
custom_image = "/home/rodwell/.config/noctalia/icons/fedora.svg"
custom_image_colorize = true
tooltip = "Fedora Linux (App Launcher)"

[widget.fedora-logo.actions]
left = "panel-toggle launcher"
right = "settings-toggle"

[widget.media]
hide_when_no_media = true
artist_first = true
art_size     = 18

[widget.network]
show_label = false
vpn_status = "replace"

[widget.net-speed-down]
type = "sysmon"
stat = "net_rx"
visualization = "none"
show_value = true
show_glyph = true
network_speed_unit = "auto"
network_speed_compact = true

[widget.tray]
drawer = true
drawer_columns = 3
drawer_item_size = 20
hide_passive = true

[widget.clock]
format = "{:%d %b  %H:%M}"
tooltip_format = "{:%A, %d %B %Y}"

# ==============================================================================
# SINGLE TOP BAR (Spacious & Clean Layout)
# ==============================================================================

[bar.default]
position           = "top"
enabled            = true
auto_hide          = false
reserve_space      = true
layer              = "top"
thickness          = 26
background_opacity = 0.85
border_width       = 0.0
shadow             = false
contact_shadow     = false
panel_overlap      = 0
radius             = 0
margin_ends        = 0
margin_edge        = 0
padding            = 14
widget_spacing     = 14
hover_highlight    = true
scale              = 0.95

# Widget Capsules (Subtle Pill separation)
capsule            = true
capsule_fill       = "surface_variant"
capsule_thickness  = 0.78
capsule_radius     = 6.0
capsule_opacity    = 0.65

start  = ["fedora-logo", "workspaces", "active_window"]
center = ["media"]
end    = ["tray", "network", "net-speed-down", "volume", "brightness", "clock", "control-center"]

[bar.default.dead_zone.actions]
left   = "panel-toggle launcher"
right  = "panel-toggle control-center"
scroll_up   = "volume-up"
scroll_down = "volume-down"

[dock]
enabled = false
