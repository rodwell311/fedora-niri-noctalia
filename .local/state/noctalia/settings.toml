        center_text = true
        clock_style = "digital"
        color = "on_surface"
        font_family = "SF Pro Display"
        format = "{:%A, %d %B}"
        shadow = true

[shell]
avatar_path = "/home/rodwell/Pictures/walls/hiyuk_profile2.jpg"

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    app_grid = true

    [shell.panel]
    clipboard_placement = "attached"
    polkit_placement = "attached"
    transparency_mode = "glass"

[theme]
builtin = "Kanagawa"
community_palette = "ADW"
custom_palette = "CatppuccinCustom"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "niri", "starship" ]
    community_ids = [ "whitesur-icons" ]

[wallpaper]
directory = "/home/rodwell/Pictures/walls"

    [wallpaper.default]
    path = "/home/rodwell/Pictures/walls/one.jpg"

    [wallpaper.last]
    path = "/home/rodwell/Pictures/walls/one.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/rodwell/Pictures/walls/one.jpg"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/rodwell/Pictures/walls/26668334.png"
    theme_mode = "dark"
    wallpaper_scheme = "m3-content"