# ==============================================================================
# Prevent WebRTC and communication apps (Chromium, Brave, Discord, Zoom, etc.)
# from automatically adjusting or lowering the microphone (source) volume.
# ==============================================================================
pulse.rules = [
    {
        matches = [
            {
                # Match all applications except dedicated audio mixer tools
                application.process.binary = "!pavucontrol"
            }
        ]
        actions = {
            quirks = [ block-source-volume ]
        }
    }
]
